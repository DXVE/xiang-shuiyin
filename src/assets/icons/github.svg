<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- GitHub 标识(「关于」弹窗底部那个仓库链接的图标)。原样取自 GitHub 官方的 octicon-mark-github,
       只改了两处: 属性清掉(aria-hidden/class/style 那套 HTML 的用不上)、fill 写死成本程序的灰
       —— 原文件是 `currentColor`, 在 Qt 的 SVG 渲染里解析不出来(会变黑)。

       fill 取 #5A554C: **比次级灰 MUTED(#7A756C)深一档**(用户: "GitHub 的图片填充色深一档")。
       "一档"按本程序自己的口径算 —— theme 里 LINE(#E6E0D6) → EMPTY_SLOT(#C6BEB0) 那一档是每通道
       -32, 同口径套到 MUTED 上就是 (0x7A-0x20, 0x75-0x20, 0x6C-0x20) = #5A554C(L* 49.4 → 36.4)。
       同一族的暖灰, 只降明度不换色相; 原先那档在窗口底色上偏淡, 图标立不住。 -->
