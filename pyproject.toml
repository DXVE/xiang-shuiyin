[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiang-shuiyin-qt"
version = "0.1.0"
description = "镶·水印 · Qt6 桌面版(相机参数水印渲染)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0",
    "exifread>=3.0",
    # 运行时仅使用 QtWidgets/QtGui/QtCore(均在 PySide6-Essentials 内);
    # 此处依赖 PySide6 元包, 打包时应换成 PySide6-Essentials
    "PySide6>=6.11",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/ui"]

# 资源在包外(src/assets), 构建产物中必须显式搬入: 装成 <site-packages>/assets,
# 与 core/app.py 的定位规则一致(资源目录 = 包目录的上一级)。
[tool.hatch.build.targets.wheel.force-include]
"src/assets" = "assets"

[tool.ruff]
line-length = 100
target-version = "py310"
