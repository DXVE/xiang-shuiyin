[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiang-shuiyin-qt"
dynamic = ["version"]
description = "「镶 · 水印」 水印处理工具（Qt6 桌面版）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0",
    "exifread>=3.0",
    "PySide6-Essentials>=6.11",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/ui", "src/cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/assets" = "assets"

[tool.hatch.version]
path = "src/core/__init__.py"
pattern = '__version__\s*=\s*"(?P<version>[^"]+)"'

[tool.ruff]
line-length = 100
target-version = "py310"
