[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiang-shuiyin-qt"
# 版本以源码 __version__ 与 git tag 为准，本字段仅满足 PEP 621 必填要求
version = "0.0.0"
description = "「镶 · 水印」 水印处理工具（Qt6 桌面版）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0",
    "exifread>=3.0",
    "PySide6-Essentials>=6.11",
]

[dependency-groups]
# 仅构建期使用，uv sync 默认安装
dev = [
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/ui", "src/cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/assets" = "assets"

[tool.ruff]
line-length = 100
target-version = "py310"
