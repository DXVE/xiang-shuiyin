name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Windows 专用: PyInstaller 与 Inno Setup 都只在 Windows 上出本项目的分发产物
    runs-on: windows-latest
    env:
      # 版本号 = 触发发布的 v* tag; 放在 job 级 env, 而不是在 run 里内插 ${{ github.ref_name }}, 以免 tag 里的 $() 与引号被 shell 当代码执行
      BUILD_TAG: ${{ github.ref_name }}
      XSY_ONEDIR: '1'
      # 安装器产物路径, 等于脚本里 OutputBaseFilename 的值(位于 OutputDir=..\dist)
      INSTALLER: dist\xiangshuiyin-qt-portable.exe
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          # 需满足 pyproject 的 requires-python>=3.10
          python-version: '3.14'

      - name: 安装构建依赖
        # 用 -e 与仓库文档中的本地流程保持一致
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: 安装 Inno Setup
        # 用官方发行包而非包管理器: 安装路径可控, 版本固定(升级即替换下面的版本号)
        # /PORTABLE=1 免注册表与卸载器, 装完只需要其中的 ISCC.exe(命令行编译器)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PORTABLE=1', '/NOICONS', "/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) {
            Write-Error 'ISCC.exe 未安装成功'
            exit 1
          }

      # 发布门禁: 与 ci.yml 同一套脚本, 不通过就不打包
      - name: 发布门禁 - 文档检查
        shell: pwsh
        run: pwsh -File scripts/check_docs_style.ps1

      - name: 发布门禁 - 代码检查
        run: python scripts/check_code_style.py

      - name: 发布门禁 - 静态分析
        run: |
          python -m pip install --quiet ruff
          python -m ruff check --select F821 src main.py

      - name: 发布门禁 - 翻译完整性
        run: python scripts/check_i18n.py

      - name: 发布门禁 - 参数契约
        run: python scripts/check_params.py

      - name: 发布门禁 - 导入冒烟
        run: python -c "import sys; sys.path.insert(0, 'src'); import ui.window, cli.render, main"

      - name: 发布门禁 - 渲染冒烟
        run: python scripts/check_cli.py

      - name: PyInstaller 打包（目录形态）
        run: python -m PyInstaller --noconfirm packaging\xiangshuiyin-qt.spec

      - name: 产物自检（资源 / 翻译 / 许可 / 版本号）
        run: python scripts/check_bundle.py --dist dist/xiangshuiyin-qt --expect-version ${{ github.ref_name }}

      - name: 编译安装器
        shell: pwsh
        run: |
          $iscc = Join-Path $env:RUNNER_TEMP 'innosetup\ISCC.exe'
          & $iscc 'packaging\xiangshuiyin-qt.iss'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "安装器编译失败（ISCC 退出码 $LASTEXITCODE）"
            exit 1
          }
          if (-not (Test-Path $env:INSTALLER)) {
            Write-Error "未生成安装器: $($env:INSTALLER)"
            exit 1
          }

      - name: 重命名产物并列出大小
        # 资产名带上 tag, 便于用户区分版本
        shell: pwsh
        run: |
          $dst = "dist\xiangshuiyin-qt-portable-$env:BUILD_TAG.exe"
          Move-Item -Path $env:INSTALLER -Destination $dst -Force
          Get-Item $dst |
            Select-Object Name, @{N = 'Size_MB'; E = { [Math]::Round($_.Length / 1MB, 2) }}, LastWriteTime |
            Format-Table -AutoSize

      - name: 清理同名 tag 的旧 release
        # 先删后建: 重推同一 tag 时同名资产会被 overwrite_files(默认 true)覆盖, 但历史遗留的旧命名产物不会被覆盖, 会在 release 里堆积多个产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:BUILD_TAG   # 与 github.ref_name 同值, 不内插进脚本以免 tag 字符被当代码执行
          gh release view $tag --json name 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "发现旧 release, 正在删除..."
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) {
              Write-Error "删除旧 release 失败, 请检查权限或网络"
              exit 1
            }
            Write-Host "已删除旧 release: $tag"
          } else {
            Write-Host "无旧 release ($tag), 跳过清理"
          }
          # gh release view 未命中时 $LASTEXITCODE 非 0, 不重置会让本步整体判失败
          $LASTEXITCODE = 0

      - name: 上传安装器到 Release
        # 源码 zip/tar.gz 由 GitHub 自动生成(Source code), 不自行打包
        uses: softprops/action-gh-release@v3
        with:
          # 资产名随 tag 变化; 未匹配到文件时默认静默跳过, 会发布出没有产物的 release, 必须显式失败
          fail_on_unmatched_files: true
          files: |
            dist/xiangshuiyin-qt-portable-${{ github.ref_name }}.exe
