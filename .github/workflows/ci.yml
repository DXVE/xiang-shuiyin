name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # 与发布平台一致(Windows): 渲染结果与字体渲染在该平台上标定, 换平台会引入无意义的差异
    runs-on: windows-latest
    env:
      # 控制台按 UTF-8 输出, 否则脚本里的中文在 CI 日志上会因编码报错
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 版本号检查（源码版本号格式）
        # 与发布门禁同一份脚本; CI 没有 tag, 这里只校验源码版本号本身
        run: python scripts/check_version.py

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 文档检查（机器相关定位信息 / 排版体例 / 术语 / 交叉引用）
        shell: pwsh
        run: pwsh -File scripts/check_docs_style.ps1

      - name: 代码检查（本机路径写死 / 凭据 / 过期定位信息 / 注释体例）
        run: python scripts/check_code_style.py

      - name: 静态分析（未定义名一类只在运行期暴露的错误）
        run: |
          python -m pip install --quiet ruff
          python -m ruff check --select F821 src main.py

      - name: 翻译完整性（界面中文是否包裹 / 未完成条目 / 内核模板覆盖）
        run: python scripts/check_i18n.py

      - name: 参数契约（参数表 / 内核签名 / 默认值）
        run: python scripts/check_params.py

      - name: 导入冒烟（界面与命令行入口都能被导入）
        run: python -c "import sys; sys.path.insert(0, 'src'); import ui.window, cli.render, main"

      - name: 渲染冒烟（命令行出图：退出码 / 产物 / 参数生效 / 可复现）
        run: python scripts/check_cli.py
